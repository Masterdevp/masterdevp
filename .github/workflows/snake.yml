name: Generar serpiente de contribuciones

on:
  schedule:
    # Se actualiza automáticamente cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch: # Permite ejecutarlo manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generar serpiente (SVG)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ef4444&color_dots=#161b22,#450a0a,#7f1d1d,#b91c1c,#ef4444
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Guardar animación en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
